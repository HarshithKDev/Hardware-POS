    <title>hardware-pos</title>
    <script>
      // Apply the saved theme before the app draws, so a light-theme device never flashes dark
      try {
        if (localStorage.getItem('posTheme') === 'light') {
          document.documentElement.classList.add('theme-light');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#FFFFFF');
        } else {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* ignore */ }
    </script>
    <script>
      // Safety net for deployments: if the app's main file can't be loaded (an old cached
      // page asking for a file from the previous version), clear the offline cache and
      // reload once. Never loops: a second failure in the same tab shows a reload button.
      (function () {
        var KEY = 'pos_boot_recovery';
        function recover() {
          if (window.__posBooted) return;
          if (sessionStorage.getItem(KEY)) {
            var root = document.getElementById('root');
            if (root && !root.firstChild) {
              root.innerHTML = '<div style="font-family:sans-serif;color:#fafafa;background:#0a0a0a;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center">' +
                '<p style="font-size:16px;margin:0">The app could not load the latest version.</p>' +
                '<button onclick="sessionStorage.removeItem(\'' + KEY + '\');location.reload()" style="height:44px;padding:0 20px;border-radius:6px;border:0;background:#2563EB;color:#fff;font-size:15px;font-weight:600;cursor:pointer">Reload</button></div>';
            }
            return;
          }
          sessionStorage.setItem(KEY, '1');
          var jobs = [];
          if ('serviceWorker' in navigator) {
            jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
              return Promise.all(rs.map(function (r) { return r.unregister(); }));
            }).catch(function () {}));
          }
          if (window.caches && caches.keys) {
            jobs.push(caches.keys().then(function (ks) {
              return Promise.all(ks.map(function (k) { return caches.delete(k); }));
            }).catch(function () {}));
          }
          Promise.all(jobs).then(function () { location.reload(); });
        }
        window.addEventListener('error', function (e) {
          var t = e && e.target;
          if (t && t.tagName === 'SCRIPT' && t.type === 'module') recover();
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Very old browsers (e.g. iPhone on iOS 15.3 or earlier) can't apply this app's styles and
      // would show a broken page. Show a plain "please update" message instead. Old-style JS on purpose.
      (function () {
        var supported = typeof window.CSSLayerBlockRule !== 'undefined';
        if (supported) return;
        window.__posUnsupportedBrowser = true;
        var root = document.getElementById('root');
        if (root) root.style.display = 'none';
        var box = document.createElement('div');
        box.setAttribute('role', 'alert');
        box.style.cssText = 'font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:#fafafa;background:#0a0a0a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center';
        box.innerHTML = '<div style="max-width:420px">' +
          '<h1 style="font-size:22px;margin:0 0 12px">Please update your browser</h1>' +
          '<p style="font-size:16px;line-height:1.5;margin:0 0 16px;color:#d4d4d4">This app needs a newer browser to work properly.</p>' +
          '<p style="font-size:15px;line-height:1.5;margin:0 0 8px;color:#d4d4d4"><b>iPhone / iPad:</b> update to iOS 15.4 or later (Settings &rsaquo; General &rsaquo; Software Update).</p>' +
          '<p style="font-size:15px;line-height:1.5;margin:0;color:#d4d4d4"><b>Android / computer:</b> use the latest Google Chrome or Microsoft Edge.</p>' +
          '</div>';
        document.body.appendChild(box);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
